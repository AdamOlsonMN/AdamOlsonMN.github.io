<!doctype html>
<!--
	Source for public/og-default.png, the link-preview card used when a page
	sets no image of its own. To regenerate after editing, from the repo root:

	"C:\Program Files\Google\Chrome\Application\chrome.exe" \
		--headless=new --hide-scrollbars --window-size=1200,630 \
		--virtual-time-budget=5000 --screenshot=public/og-default.png \
		scripts/og-image.html

	Any Chromium works; the fonts load from Google Fonts, so it needs network.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=JetBrains+Mono:wght@500&display=block"
			rel="stylesheet"
		/>
		<style>
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #ffffff;
				color: #14161b;
			}

			.card {
				box-sizing: border-box;
				height: 100%;
				padding: 88px 96px;
				display: flex;
				flex-direction: column;
				border-left: 16px solid #1d4ed8;
			}

			.domain {
				font: 500 30px 'JetBrains Mono', monospace;
				color: #565d68;
			}

			h1 {
				margin: auto 0 0;
				font: 700 112px/1.05 Inter, sans-serif;
				letter-spacing: -0.02em;
			}

			p {
				margin: 36px 0 0;
				padding-top: 36px;
				border-top: 2px solid #e3e6ea;
				font: 600 40px/1.3 Inter, sans-serif;
				color: #565d68;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="domain">adamolson.org</div>
			<h1>Adam Olson</h1>
			<p>Data scientist. Political scientist in a previous life.</p>
		</div>
	</body>
</html>
