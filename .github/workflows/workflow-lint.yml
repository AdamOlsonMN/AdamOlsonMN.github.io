name: Workflow syntax

on:
  push:
    branches: [master]
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflow syntax and expressions
        # Shell/Python linting belongs to each owner's checks.
        run: '"$HOME/go/bin/actionlint" -shellcheck="" -pyflakes=""'
